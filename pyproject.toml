[project]
name = "asp-demand"
version = "0.1.0"
description = "Local LightGBM-based ASP demand prediction from ALB access logs + Japan calendar"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.3",
    "pandas>=2.2",
    "pyarrow>=16",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "jpholiday>=0.1.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "fsspec>=2024.3",
    "s3fs>=2024.3",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "plotly>=5.20",
]

[project.scripts]
asp-demand = "asp_demand.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.4",
    "mypy>=1.9",
    "pytest>=8.0",
    "pandas-stubs>=2.2",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asp_demand"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
